spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/css
    username: css
    password: css

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Local DB already has shop_order from earlier JDBC labs, but no flyway_schema_history.
    baseline-on-migrate: true
